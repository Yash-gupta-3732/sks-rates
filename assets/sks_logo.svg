<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="100%" height="100%">
  <!-- Glow filter -->
  <defs>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g fill="#f1f5e8" stroke="#f1f5e8" filter="url(#subtle-glow)">
    <!-- 4 Sparkle Stars (Exact Match to Photo) -->
    <!-- Star 1: Top Left -->
    <path d="M 64,30 Q 64,38 56,38 Q 64,38 64,46 Q 64,38 72,38 Q 64,38 64,30 Z" stroke="none" />
    <polygon points="64,32 66,36 70,38 66,40 64,44 62,40 58,38 62,36" stroke="none" />

    <!-- Star 2: Lower Left -->
    <path d="M 54,54 Q 54,61 47,61 Q 54,61 54,68 Q 54,61 61,61 Q 54,61 54,54 Z" stroke="none" />
    <polygon points="54,56 55.5,59 58.5,61 55.5,63 54,66 52.5,63 49.5,61 52.5,59" stroke="none" />

    <!-- Star 3: Top Right -->
    <path d="M 148,34 Q 148,42 140,42 Q 148,42 148,50 Q 148,42 156,42 Q 148,42 148,34 Z" stroke="none" />
    <polygon points="148,36 150,40 154,42 150,44 148,48 146,44 142,42 146,40" stroke="none" />

    <!-- Star 4: Lower Right -->
    <path d="M 154,58 Q 154,64 148,64 Q 154,64 154,70 Q 154,64 160,64 Q 154,64 154,58 Z" stroke="none" />
    <polygon points="154,60 155.5,62.5 158,64 155.5,65.5 154,68 152.5,65.5 150,64 152.5,62.5" stroke="none" />

    <!-- Brilliant Cut Solitaire Diamond (Exact Facets) -->
    <!-- Table & Upper Girdle Facets -->
    <polygon points="76,38 124,38 140,54 60,54" fill="#d9e6f3" stroke="#12253a" stroke-width="1.6" stroke-linejoin="round" />
    <polygon points="76,38 92,38 84,54 60,54" fill="#e9f1f8" stroke="#12253a" stroke-width="1.4" stroke-linejoin="round" />
    <polygon points="92,38 108,38 100,54 84,54" fill="#ffffff" stroke="#12253a" stroke-width="1.4" stroke-linejoin="round" />
    <polygon points="108,38 124,38 140,54 116,54" fill="#cee0f0" stroke="#12253a" stroke-width="1.4" stroke-linejoin="round" />
    <polygon points="100,54 116,54 108,38" fill="#e0ecf7" stroke="#12253a" stroke-width="1.4" stroke-linejoin="round" />
    
    <!-- Pavilion Lower Facets (pointing down to culet tip at 100, 95) -->
    <polygon points="60,54 84,54 100,96" fill="#c3d8ee" stroke="#12253a" stroke-width="1.4" stroke-linejoin="round" />
    <polygon points="84,54 100,54 100,96" fill="#ffffff" stroke="#12253a" stroke-width="1.4" stroke-linejoin="round" />
    <polygon points="100,54 116,54 100,96" fill="#e5effa" stroke="#12253a" stroke-width="1.4" stroke-linejoin="round" />
    <polygon points="116,54 140,54 100,96" fill="#b1cde8" stroke="#12253a" stroke-width="1.4" stroke-linejoin="round" />

    <!-- Circular Ring Band (broken at top with gaps for diamond culet) -->
    <path d="M 72,78 A 66,66 0 1,0 128,78" fill="none" stroke="#f1f5e8" stroke-width="4.2" stroke-linecap="round" />

    <!-- Stylized "K" Inside the Ring (Authentic Anatomy) -->
    <!-- Vertical stem of K -->
    <polygon points="83,108 93,108 93,205 83,205" stroke="none" />
    
    <!-- Upper Diagonal Arm of K (crosses over the circular ring at top-right!) -->
    <polygon points="93,162 147,82 153,88 93,172" stroke="none" />
    
    <!-- Lower Diagonal Leg of K (extends to bottom-right of the circle) -->
    <polygon points="102,154 141,200 134,204 93,164" stroke="none" />

    <!-- Left Elegant Serif 'S' -->
    <text x="63" y="167" font-family="'Times New Roman', Georgia, serif" font-size="52" font-weight="bold" text-anchor="middle" stroke="none">S</text>

    <!-- Right Elegant Serif 'S' (nested under upper arm of K) -->
    <text x="135" y="167" font-family="'Times New Roman', Georgia, serif" font-size="52" font-weight="bold" text-anchor="middle" stroke="none">S</text>
  </g>
</svg>
